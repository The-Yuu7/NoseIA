# ======================================================================
# CONFIGURACIÓN DE INTEGRACIÓN Y DESPLIEGUE CONTINUO (CI/CD) - GITLAB
# PROYECTO: CONTROL DE CALIDAD DE BIOCOMBUSTIBLES VÍA BIO-E-NOSE (GCN-LSTM)
# ======================================================================

stages:
  - lint
  - test
  - build
  - deploy

variables:
  PYTHON_VERSION: "3.10"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/
    - .venv/

lint_code:
  stage: lint
  image: python:3.10-slim
  script:
    - python -m pip install --upgrade pip
    - pip install flake8 black
    - flake8 backend/ --max-line-length=120 --ignore=E501,W503

run_unit_tests:
  stage: test
  image: python:3.10-slim
  script:
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements.txt pytest pytest-cov
    - cd backend && pytest test_api.py --junitxml=../report.xml --cov=. --cov-report=xml

build_docker:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - cd .devops
    - docker build -t bioenose-backend:latest -f Dockerfile ..

deploy_rpi:
  stage: deploy
  only:
    - main
  script:
    - echo "Desplegando servicio en Raspberry Pi 4 B (MAGLIONI AP)..."
    - bash infrastructure/start_enose.sh
