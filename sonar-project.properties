# SonarQube / SonarCloud Root Configuration File
sonar.projectKey=The-Yuu7_NoseIA
sonar.organization=the-yuu7
sonar.projectName=NoseIA
sonar.projectVersion=1.0.0

# Source Files & Directories (explicit list to prevent source/test overlap)
sonar.sources=backend/api.py,backend/simulator.py,python,infrastructure,database

# Test Files (isolated from sonar.sources)
sonar.tests=backend/test_api.py

# Exclusions
sonar.exclusions=**/static/tailwind.js, **/static/chart.js, **/*.csv, **/*.tflite, **/*.pkl, **/modelo_exportado/**, frontend/**

# Coverage & Encoding
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8
